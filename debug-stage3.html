<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <title>Stage 3 — Despertarlos — Galería debug de assets</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: monospace; padding: 24px; }
    h1 { color: #f0c040; margin-bottom: 8px; font-size: 1.1rem; }
    .stage-badge { display:inline-block; background:#1b5e20; color:#fff; padding:2px 10px;
      border-radius:4px; font-size:0.78rem; margin-bottom:20px; }
    h2 { color: #90c0ff; font-size: 0.95rem; margin: 28px 0 10px; border-bottom: 1px solid #334; padding-bottom: 4px; }
    h3 { color: #ccc; font-size: 0.85rem; margin: 18px 0 6px; }
    #status { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .asset-status { padding: 4px 10px; border-radius: 4px; font-size: 0.78rem; border: 1px solid #444; }
    .asset-status.ok  { border-color: #4c4; color: #4c4; }
    .asset-status.err { border-color: #c44; color: #c44; }
    .frame-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
    .frame-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .frame-cell canvas { border: 1px solid #444; background: repeating-conic-gradient(#2a2a3a 0% 25%, #1a1a2e 0% 50%) 0 0 / 12px 12px; }
    .frame-label { font-size: 0.65rem; color: #888; text-align: center; line-height: 1.3; }
    .composite-wrap { margin-top: 6px; }
    .composite-wrap canvas { border: 1px solid #446; max-width: 100%; display: block; }
    #summary { margin-top: 28px; font-size: 0.8rem; color: #aaa; }
    #summary b { color: #e0e0e0; }
  </style>
</head>
<body>
  <h1>Stage 3 — Despertarlos — Galería debug de assets</h1>
  <div class="stage-badge">ETAPA 3 OFICIAL — despertar a los dos hombres</div>

  <h2>Estado de carga</h2>
  <div id="status">Cargando...</div>
  <div id="gallery"></div>
  <div id="summary"></div>

  <script src="src/stages/stage3/manifest.js"></script>
  <script>
    const THUMB_W = 180, THUMB_H = 100, COMPOSITE_MAX_W = 640;

    function makeCanvas(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h; return c;
    }
    function renderFrame(img, col, row, cellW, cellH) {
      const scale = Math.min(THUMB_W / cellW, THUMB_H / cellH);
      const dw = Math.round(cellW * scale), dh = Math.round(cellH * scale);
      const c = makeCanvas(dw, dh);
      c.getContext('2d').drawImage(img, col * cellW, row * cellH, cellW, cellH, 0, 0, dw, dh);
      return c;
    }
    function renderComposite(img, def) {
      const scale = Math.min(COMPOSITE_MAX_W / def.w, 1);
      const dw = Math.round(def.w * scale), dh = Math.round(def.h * scale);
      const c = makeCanvas(dw, dh);
      c.getContext('2d').drawImage(img, 0, 0, def.w, def.h, 0, 0, dw, dh);
      return c;
    }
    loadStage3Assets().then(loaded => {
      const panel = document.getElementById('status');
      panel.innerHTML = '';
      let okCount = 0;
      for (const [key, res] of Object.entries(loaded)) {
        const def = STAGE3_MANIFEST[key];
        const el = document.createElement('div');
        el.className = 'asset-status ' + (res.ok ? 'ok' : 'err');
        el.title = def.src;
        el.textContent = (res.ok ? '✓ ' : '✗ ') + key;
        panel.appendChild(el);
        if (res.ok) okCount++;
      }
      const gallery = document.getElementById('gallery');
      for (const [key, def] of Object.entries(STAGE3_MANIFEST)) {
        const res = loaded[key];
        const h3 = document.createElement('h3');
        h3.textContent = key + ' — ' + def.src + (def.cols ? '  [' + def.cols + '×' + def.rows + ']' : '');
        gallery.appendChild(h3);
        if (!res.ok) { const p = document.createElement('p'); p.style.color='#c44'; p.textContent='✗ No cargó'; gallery.appendChild(p); continue; }
        if (def.cols) {
          const grid = document.createElement('div'); grid.className = 'frame-grid';
          for (let r = 0; r < def.rows; r++) for (let c2 = 0; c2 < def.cols; c2++) {
            const cell = document.createElement('div'); cell.className = 'frame-cell';
            cell.appendChild(renderFrame(res.img, c2, r, def.cellW, def.cellH));
            const lbl = document.createElement('div'); lbl.className = 'frame-label';
            lbl.textContent = '[' + r + ',' + c2 + ']'; cell.appendChild(lbl);
            grid.appendChild(cell);
          }
          gallery.appendChild(grid);
        } else {
          const wrap = document.createElement('div'); wrap.className = 'composite-wrap';
          wrap.appendChild(renderComposite(res.img, def)); gallery.appendChild(wrap);
        }
      }
      const total = Object.keys(STAGE3_MANIFEST).length;
      document.getElementById('summary').innerHTML =
        '<b>' + okCount + '/' + total + '</b> assets cargados. ' +
        (okCount === total ? '<span style="color:#4c4">✓ Sin errores.</span>' : '<span style="color:#c44">✗ Revisar consola.</span>');
    });
  </script>
</body>
</html>
